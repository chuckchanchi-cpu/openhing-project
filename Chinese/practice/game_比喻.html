<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>比喻修辭遊戲 — 蘇格拉底與麥穗</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body {
    font-family: "PingFang TC","Microsoft JhengHei","Noto Sans TC",sans-serif;
    background: linear-gradient(160deg,#fdeef3 0%,#f5dbe6 50%,#ecc4d4 100%);
    min-height:100vh; display:flex; flex-direction:column; align-items:center;
    padding:16px; user-select:none;
  }
  .header { text-align:center; margin-bottom:12px; width:100%; max-width:520px; }
  .header h1 { font-size:1.35em; color:#6b1d3f; }
  .header .sub { color:#8b3d5e; font-size:0.9em; margin-top:4px; }
  .stats { display:flex; justify-content:space-between; width:100%; max-width:520px;
    background:#fff0f6; border-radius:14px; padding:10px 16px; margin-bottom:14px;
    box-shadow:0 2px 8px rgba(107,29,63,.15); font-size:1em; color:#6b1d3f; font-weight:bold; }
  .hearts { color:#e05252; font-size:1.2em; letter-spacing:2px; }
  .card { background:#fff; border-radius:18px; padding:22px 18px; width:100%; max-width:520px;
    box-shadow:0 4px 16px rgba(107,29,63,.2); margin-bottom:16px; }
  .qnum { color:#c05a8a; font-size:0.85em; font-weight:bold; margin-bottom:8px; }
  .question { font-size:1.25em; line-height:1.9; color:#401226; }
  .blank { display:inline-block; min-width:2.6em; border-bottom:3px solid #c05a8a;
    color:#a03d6b; font-weight:bold; text-align:center; margin:0 2px; }
  .blank.filled { border-bottom-color:#4caf50; color:#2e7d32; }
  .blank.wrong { border-bottom-color:#e05252; color:#e05252; }
  .words { display:flex; flex-wrap:wrap; gap:10px; justify-content:center; margin-top:18px; }
  .word { background:linear-gradient(180deg,#f0a0c0,#d8709a); color:#fff; font-size:1.15em;
    font-weight:bold; padding:12px 16px; border-radius:14px; border:none; cursor:pointer;
    box-shadow:0 3px 0 #a85078, 0 4px 10px rgba(0,0,0,.15); transition:transform .05s; }
  .word:active { transform:translateY(3px); box-shadow:0 0 0 #a85078, 0 2px 6px rgba(0,0,0,.15); }
  .word.used { opacity:.25; pointer-events:none; }
  .feedback { text-align:center; font-size:1.15em; font-weight:bold; min-height:1.8em; margin-top:14px; }
  .ok { color:#2e7d32; } .no { color:#e05252; }
  .end { text-align:center; padding:10px 0; }
  .end h2 { color:#6b1d3f; font-size:1.5em; margin-bottom:8px; }
  .end .stars { font-size:2.6em; letter-spacing:6px; margin:10px 0; }
  .end p { color:#4a2a3a; font-size:1.1em; line-height:1.7; }
  .btn { background:linear-gradient(180deg,#8fd47f,#4caf50); color:#fff; font-size:1.2em;
    font-weight:bold; border:none; padding:14px 34px; border-radius:30px; margin-top:16px;
    box-shadow:0 3px 0 #2e7d32; cursor:pointer; }
  .btn:active { transform:translateY(3px); box-shadow:none; }
  .hidden { display:none; }
</style>
</head>
<body>
  <div class="header">
    <h1>🎨 比喻修辭遊戲</h1>
    <div class="sub">蘇格拉底與麥穗 · 明喻・暗喻・借喻</div>
  </div>

  <div class="stats">
    <span>第 <span id="qnum">1</span> / <span id="qtotal">12</span> 題</span>
    <span class="hearts" id="hearts">❤️❤️❤️</span>
    <span>⭐ <span id="score">0</span></span>
  </div>

  <div class="card" id="gameCard">
    <div class="qnum" id="qLabel">題目 1</div>
    <div class="question" id="question"></div>
    <div class="words" id="words"></div>
    <div class="feedback" id="feedback"></div>
  </div>

  <div class="card end hidden" id="endCard">
    <h2 id="endTitle">完成！</h2>
    <div class="stars" id="stars">⭐⭐⭐</div>
    <p id="endMsg"></p>
    <button class="btn" onclick="restart()">🔄 再玩一次</button>
  </div>

<script>
let QUESTIONS = [
  { q: "「漫長的人生宛如在寬廣的麥田中前行。」用了哪種比喻？", a: "明喻", opt: ["明喻","暗喻","借喻","誇張"] },
  { q: "課文中「麥穗」借喻甚麼？", a: "機會", opt: ["機會","食物","結果","麥田"] },
  { q: "「時間是寶貴的財富。」用了哪種比喻？", a: "暗喻", opt: ["暗喻","明喻","借喻","擬人"] },
  { q: "借喻中，哪一項不會在句子中出現？", a: "本體和比喻詞", opt: ["本體和比喻詞","喻體","本體和喻體","只有比喻詞"] },
  { q: "明喻需要哪三個要素？", a: "本體、喻體、比喻詞", opt: ["本體、喻體、比喻詞","本體、喻體","喻體、比喻詞","本體、比喻詞"] },
  { q: "「湖面好像一面鏡子。」屬於哪種比喻？", a: "明喻", opt: ["明喻","暗喻","借喻","排比"] },
  { q: "「老師是辛勤的園丁。」屬於哪種比喻？", a: "暗喻", opt: ["暗喻","明喻","借喻","設問"] },
  { q: "「孩子們是祖國的花朵。」「花朵」比喻甚麼？", a: "孩子們", opt: ["孩子們","祖國","園丁","春天"] },
  { q: "課文中「麥穗」比喻人生中的甚麼？", a: "眼前的機會", opt: ["眼前的機會","食物","收成","麥田"] },
  { q: "「她的笑容像陽光一樣溫暖。」屬於哪種比喻？", a: "明喻", opt: ["明喻","暗喻","借喻","反問"] },
  { q: "暗喻通常用哪一個字連接本體和喻體？", a: "是", opt: ["是","好像","宛如","如同"] },
  { q: "「他心中燃起了希望的火種。」「火種」借喻甚麼？", a: "希望", opt: ["希望","火焰","溫暖","光明"] }
];

let idx = 0, hearts = 3, score = 0;

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function render() {
  const q = QUESTIONS[idx];
  document.getElementById("qnum").textContent = idx + 1;
  document.getElementById("qtotal").textContent = QUESTIONS.length;
  document.getElementById("qLabel").textContent = "題目 " + (idx + 1);
  document.getElementById("question").textContent = q.q;
  document.getElementById("feedback").textContent = "";
  document.getElementById("feedback").className = "feedback";
  const wordsBox = document.getElementById("words");
  wordsBox.innerHTML = "";
  shuffle(q.opt).forEach(w => {
    const b = document.createElement("button");
    b.className = "word";
    b.textContent = w;
    b.onclick = () => pick(w, b);
    wordsBox.appendChild(b);
  });
}

function pick(w, btn) {
  const q = QUESTIONS[idx];
  if (w === q.a) {
    score += 10;
    document.getElementById("score").textContent = score;
    const fb = document.getElementById("feedback");
    fb.textContent = "✅ 答對了！";
    fb.className = "feedback ok";
    btn.classList.add("used");
    setTimeout(next, 800);
  } else {
    btn.classList.add("used");
    hearts--;
    document.getElementById("hearts").textContent = "❤️".repeat(hearts) + "🖤".repeat(3 - hearts);
    const fb = document.getElementById("feedback");
    fb.textContent = "❌ 再試試！";
    fb.className = "feedback no";
    if (hearts <= 0) {
      setTimeout(() => { endGame(false); }, 900);
    }
  }
}

function next() {
  idx++;
  if (idx >= QUESTIONS.length) { endGame(true); return; }
  render();
}

function endGame(completed) {
  document.getElementById("gameCard").classList.add("hidden");
  const endCard = document.getElementById("endCard");
  endCard.classList.remove("hidden");
  const stars = completed ? (hearts === 3 ? 3 : hearts === 2 ? 2 : 1) : 0;
  document.getElementById("stars").textContent = "⭐".repeat(stars) + "☆".repeat(3 - stars);
  document.getElementById("endTitle").textContent = completed ? "🎉 完成！" : "💪 加油！";
  document.getElementById("endMsg").innerHTML =
    "得分：" + score + " 分<br>" +
    (completed ? "全部 " + QUESTIONS.length + " 題都答完了！" : "繼續練習，下次一定得！");
}

function restart() {
  idx = 0; hearts = 3; score = 0;
  document.getElementById("hearts").textContent = "❤️❤️❤️";
  document.getElementById("score").textContent = "0";
  document.getElementById("endCard").classList.add("hidden");
  document.getElementById("gameCard").classList.remove("hidden");
  render();
}

// 隨機排序題目，每次玩都唔同
QUESTIONS = shuffle(QUESTIONS);
render();
</script>
</body>
</html>
