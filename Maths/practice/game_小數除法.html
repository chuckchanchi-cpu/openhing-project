<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>數學挑戰 — 小數除法（一）</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body {
    font-family: "PingFang TC","Microsoft JhengHei","Noto Sans TC",sans-serif;
    background: linear-gradient(160deg,#e8f7ee 0%,#d3efdd 50%,#b5e0c8 100%);
    min-height:100vh; display:flex; flex-direction:column; align-items:center;
    padding:16px; user-select:none;
  }
  .header { text-align:center; margin-bottom:12px; width:100%; max-width:520px; }
  .header h1 { font-size:1.35em; color:#1e5c3a; }
  .header .sub { color:#3d7a57; font-size:0.9em; margin-top:4px; }
  .stats { display:flex; justify-content:space-between; width:100%; max-width:520px;
    background:#f2fbf5; border-radius:14px; padding:10px 16px; margin-bottom:14px;
    box-shadow:0 2px 8px rgba(30,92,58,.15); font-size:1em; color:#1e5c3a; font-weight:bold; }
  .hearts { color:#e05252; font-size:1.2em; letter-spacing:2px; }
  .card { background:#fff; border-radius:18px; padding:22px 18px; width:100%; max-width:520px;
    box-shadow:0 4px 16px rgba(30,92,58,.2); margin-bottom:16px; }
  .qnum { color:#3d7a57; font-size:0.85em; font-weight:bold; margin-bottom:8px; }
  .tag { display:inline-block; background:#d9f0e3; color:#1e5c3a; border-radius:8px;
    padding:2px 10px; font-size:0.8em; margin-right:8px; }
  .question { font-size:1.3em; line-height:1.9; color:#143325; font-weight:bold; }
  .words { display:flex; flex-wrap:wrap; gap:10px; justify-content:center; margin-top:18px; }
  .word { background:linear-gradient(180deg,#4caf7d,#2e8b5d); color:#fff; font-size:1.15em;
    font-weight:bold; padding:12px 18px; border-radius:14px; border:none; cursor:pointer;
    box-shadow:0 3px 0 #1e5c3a, 0 4px 10px rgba(0,0,0,.15); transition:transform .05s; min-width:90px; }
  .word:active { transform:translateY(3px); box-shadow:0 0 0 #1e5c3a, 0 2px 6px rgba(0,0,0,.15); }
  .word.used { opacity:.25; pointer-events:none; }
  .feedback { text-align:center; font-size:1.15em; font-weight:bold; min-height:1.8em; margin-top:14px; }
  .ok { color:#2e7d32; } .no { color:#e05252; }
  .end { text-align:center; padding:10px 0; }
  .end h2 { color:#1e5c3a; font-size:1.5em; margin-bottom:8px; }
  .end .stars { font-size:2.6em; letter-spacing:6px; margin:10px 0; }
  .end p { color:#143325; font-size:1.1em; line-height:1.7; }
  .btn { background:linear-gradient(180deg,#8fd47f,#4caf50); color:#fff; font-size:1.2em;
    font-weight:bold; border:none; padding:14px 34px; border-radius:30px; margin-top:16px;
    box-shadow:0 3px 0 #2e7d32; cursor:pointer; }
  .btn:active { transform:translateY(3px); box-shadow:none; }
  .hintbtn { background:#fff3d6; color:#9a6b00; font-size:0.95em; font-weight:bold;
    border:2px solid #f0c95c; padding:8px 22px; border-radius:20px; cursor:pointer; }
  .hintbtn:active { background:#fce8b8; }
  .hintbox { background:#fffbe8; border:1px dashed #e0b84e; color:#7a5b00;
    border-radius:12px; padding:10px 14px; margin-top:10px; font-size:1em; line-height:1.7; }
  .hidden { display:none; }
</style>
</head>
<body>
  <div class="header">
    <h1>➗ 小數除法挑戰</h1>
    <div class="sub">Topic 2：小數除法（一）・16 題</div>
  </div>

  <div class="stats">
    <span>第 <span id="qnum">1</span> / <span id="qtotal">16</span> 題</span>
    <span class="hearts" id="hearts">❤️❤️❤️</span>
    <span>⭐ <span id="score">0</span></span>
  </div>

  <div class="card" id="gameCard">
    <div class="qnum"><span class="tag" id="tag">計算</span>題目 <span id="qn">1</span></div>
    <div class="question" id="question"></div>
    <div style="text-align:center; margin-top:12px;">
      <button class="hintbtn" id="hintBtn" onclick="showHint()">💡 提示</button>
    </div>
    <div class="hintbox hidden" id="hintBox"></div>
    <div class="words" id="words"></div>
    <div class="feedback" id="feedback"></div>
  </div>

  <div class="card end hidden" id="endCard">
    <h2 id="endTitle">完成！</h2>
    <div class="stars" id="stars">⭐⭐⭐</div>
    <p id="endMsg"></p>
    <button class="btn" onclick="restart()">🔄 再玩一次</button>
  </div>

<script>
let QUESTIONS = [
  { tag: "計算", q: "6.2 ÷ 2 = ?", h: "先當整數除：62 ÷ 2 = 31，6.2 有一位小數，答案就係 3.1", a: "3.1", opt: ["3.1", "3.01", "31", "0.31"] },
  { tag: "計算", q: "8.4 ÷ 6 = ?", h: "拆數法：6 ÷ 6 = 1，2.4 ÷ 6 = 0.4，合埋就係 1.4", a: "1.4", opt: ["1.4", "14", "0.14", "1.04"] },
  { tag: "計算", q: "9.3 ÷ 3 = ?", h: "拆數法：9 ÷ 3 = 3，0.3 ÷ 3 = 0.1，合埋就係 3.1", a: "3.1", opt: ["3.1", "3.3", "31", "0.31"] },
  { tag: "計算", q: "0.85 ÷ 5 = ?", h: "先當整數除：85 ÷ 5 = 17，0.85 有兩位小數，答案係 0.17", a: "0.17", opt: ["0.17", "1.7", "17", "0.017"] },
  { tag: "計算", q: "7.5 ÷ 3 = ?", h: "拆數法：6 ÷ 3 = 2，1.5 ÷ 3 = 0.5，合埋就係 2.5", a: "2.5", opt: ["2.5", "25", "0.25", "2.05"] },
  { tag: "計算", q: "6.48 ÷ 6 = ?", h: "拆數法：6 ÷ 6 = 1，0.48 ÷ 6 = 0.08，合埋就係 1.08", a: "1.08", opt: ["1.08", "1.8", "10.8", "0.18"] },
  { tag: "計算", q: "48 ÷ 5 = ?", h: "唔夠除就補 0：48.0 ÷ 5，計完小數點對齊 = 9.6", a: "9.6", opt: ["9.6", "9.06", "96", "0.96"] },
  { tag: "計算", q: "35.7 ÷ 6 = ?", h: "先當整數除：357 ÷ 6 = 59.5，35.7 有一位小數，答案係 5.95", a: "5.95", opt: ["5.95", "5.59", "59.5", "0.595"] },
  { tag: "計算", q: "77 ÷ 14 = ?", h: "拆數法：70 ÷ 14 = 5，7 ÷ 14 = 0.5，合埋就係 5.5", a: "5.5", opt: ["5.5", "5.05", "55", "0.55"] },
  { tag: "計算", q: "50.6 ÷ 22 = ?", h: "拆數法：44 ÷ 22 = 2，6.6 ÷ 22 = 0.3，合埋就係 2.3", a: "2.3", opt: ["2.3", "23", "0.23", "2.03"] },
  { tag: "計算", q: "30 ÷ 25 = ?", h: "被除數大過除數，答案大過 1。試下 25 × 1.2 = 30，所以答案係 1.2", a: "1.2", opt: ["1.2", "12", "0.12", "1.02"] },
  { tag: "計算", q: "9 ÷ 45 = ?", h: "被除數細過除數，答案細過 1。9 ÷ 45 = 0.2", a: "0.2", opt: ["0.2", "2", "0.02", "0.5"] },
  { tag: "分數化小數", q: "1/4 = ?", h: "分數化小數：分子 ÷ 分母，即係 1 ÷ 4 = 0.25。背熟：四分之一 = 0.25", a: "0.25", opt: ["0.25", "0.5", "0.75", "0.2"] },
  { tag: "分數化小數", q: "3/4 = ?", h: "分數化小數：3 ÷ 4 = 0.75。背熟：四分之三 = 0.75", a: "0.75", opt: ["0.75", "0.25", "0.5", "0.7"] },
  { tag: "應用題", q: "媽媽把一條長 35.7 米的繩子平均剪成 6 段，每段長多少米？", h: "35.7 ÷ 6 = 5.95，記得答案要寫單位「米」", a: "5.95 米", opt: ["5.95 米", "5.59 米", "59.5 米", "0.595 米"] },
  { tag: "應用題", q: "一箱橙重 7.5 公斤，平均分給 3 人，每人得多少公斤？", h: "7.5 ÷ 3 = 2.5，記得答案要寫單位「公斤」", a: "2.5 公斤", opt: ["2.5 公斤", "25 公斤", "0.25 公斤", "2.05 公斤"] }
];

let idx = 0, hearts = 3, score = 0;

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function showHint() {
  const q = QUESTIONS[idx];
  const box = document.getElementById("hintBox");
  box.textContent = "💡 " + q.h;
  box.classList.remove("hidden");
}

function render() {
  const q = QUESTIONS[idx];
  document.getElementById("hintBox").classList.add("hidden");
  document.getElementById("hintBox").textContent = "";
  document.getElementById("qnum").textContent = idx + 1;
  document.getElementById("qtotal").textContent = QUESTIONS.length;
  document.getElementById("qn").textContent = idx + 1;
  document.getElementById("tag").textContent = q.tag;
  document.getElementById("question").textContent = q.q;
  document.getElementById("feedback").textContent = "";
  document.getElementById("feedback").className = "feedback";
  const wordsBox = document.getElementById("words");
  wordsBox.innerHTML = "";
  shuffle(q.opt).forEach(w => {
    const b = document.createElement("button");
    b.className = "word";
    b.textContent = w;
    b.onclick = () => pick(w, b);
    wordsBox.appendChild(b);
  });
}

function pick(w, btn) {
  const q = QUESTIONS[idx];
  if (w === q.a) {
    score += 10;
    document.getElementById("score").textContent = score;
    const fb = document.getElementById("feedback");
    fb.textContent = "✅ 答對了！";
    fb.className = "feedback ok";
    btn.classList.add("used");
    setTimeout(next, 800);
  } else {
    btn.classList.add("used");
    hearts--;
    document.getElementById("hearts").textContent = "❤️".repeat(hearts) + "🖤".repeat(3 - hearts);
    const fb = document.getElementById("feedback");
    fb.textContent = "❌ 再試試！";
    fb.className = "feedback no";
    if (hearts <= 0) {
      setTimeout(() => { endGame(false); }, 900);
    }
  }
}

function next() {
  idx++;
  if (idx >= QUESTIONS.length) { endGame(true); return; }
  render();
}

function endGame(completed) {
  document.getElementById("gameCard").classList.add("hidden");
  const endCard = document.getElementById("endCard");
  endCard.classList.remove("hidden");
  const stars = completed ? (hearts === 3 ? 3 : hearts === 2 ? 2 : 1) : 0;
  document.getElementById("stars").textContent = "⭐".repeat(stars) + "☆".repeat(3 - stars);
  document.getElementById("endTitle").textContent = completed ? "🎉 完成！" : "💪 加油！";
  document.getElementById("endMsg").innerHTML =
    "得分：" + score + " 分<br>" +
    (completed ? "全部 " + QUESTIONS.length + " 題都答完了！" : "繼續練習，下次一定得！");
}

function restart() {
  idx = 0; hearts = 3; score = 0;
  document.getElementById("hearts").textContent = "❤️❤️❤️";
  document.getElementById("score").textContent = "0";
  document.getElementById("endCard").classList.add("hidden");
  document.getElementById("gameCard").classList.remove("hidden");
  render();
}

QUESTIONS = shuffle(QUESTIONS);
render();
</script>
</body>
</html>
