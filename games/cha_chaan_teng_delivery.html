<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>茶餐廳奶茶速遞員</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #1a0f0a;
            font-family: 'Microsoft JhengHei', 'PingFang HK', 'Noto Sans CJK', sans-serif;
            overflow: hidden;
        }
        canvas {
            border-radius: 12px;
            box-shadow: 0 12px 50px rgba(0, 0, 0, 0.6);
            max-width: 100vw;
            max-height: 100vh;
            cursor: default;
            touch-action: none;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas" width="800" height="600"></canvas>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const W = canvas.width;
        const H = canvas.height;

        let state = 'start';
        let gameOverReason = '';
        let score = 0;
        let lives = 3;
        let timeLeft = 180;
        let player = { x: W / 2, y: H - 45, width: 60, height: 50, speed: 320 };
        let items = [];
        let itemSpawnTimer = 0;
        let fallSpeedBase = 200;
        let boostTimer = 0;
        let floatingTexts = [];
        let lastTime = performance.now();
        let keys = {};

        function roundRect(ctx, x, y, w, h, r) {
            if (w < 0 || h < 0) return;
            r = Math.min(r, w / 2, h / 2);
            ctx.beginPath();
            ctx.moveTo(x + r, y);
            ctx.lineTo(x + w - r, y);
            ctx.arcTo(x + w, y, x + w, y + r, r);
            ctx.lineTo(x + w, y + h - r);
            ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
            ctx.lineTo(x + r, y + h);
            ctx.arcTo(x, y + h, x, y + h - r, r);
            ctx.lineTo(x, y + r);
            ctx.arcTo(x, y, x + r, y, r);
            ctx.closePath();
        }

        function resetGame() {
            score = 0;
            lives = 3;
            timeLeft = 180;
            items = [];
            itemSpawnTimer = 0;
            fallSpeedBase = 200;
            boostTimer = 0;
            floatingTexts = [];
            player.x = W / 2;
            player.y = H - 45;
            state = 'playing';
            gameOverReason = '';
        }

        function addFloatingText(x, y, text, color) {
            floatingTexts.push({
                x: x,
                y: y,
                text: text,
                color: color,
                life: 1.0,
                maxLife: 1.0
            });
        }

        function spawnItem() {
            let rand = Math.random();
            let type;
            if (rand < 0.50) {
                type = 'milk_tea';
            } else if (rand < 0.78) {
                type = 'claypot_rice';
            } else {
                type = 'pineapple_bun';
            }
            let baseX = 40 + Math.random() * (W - 80);
            items.push({
                type: type,
                baseX: baseX,
                x: baseX,
                y: -30,
                speed: fallSpeedBase + Math.random() * 80,
                wobble: Math.random() * Math.PI * 2,
                wobbleSpeed: 1.2 + Math.random() * 2.0
            });
        }

        function checkCollision(px, py, pw, ph, ix, iy, ir) {
            let closestX = Math.max(px - pw / 2, Math.min(ix, px + pw / 2));
            let closestY = Math.max(py - ph / 2, Math.min(iy, py + ph / 2));
            let dx = ix - closestX;
            let dy = iy - closestY;
            return (dx * dx + dy * dy) < (ir * ir);
        }

        function update(dt) {
            if (state !== 'playing') return;

            timeLeft -= dt;
            if (timeLeft <= 0) {
                timeLeft = 0;
                gameOverReason = '時間到！';
                state = 'gameover';
                return;
            }

            if (boostTimer > 0) {
                boostTimer -= dt;
                if (boostTimer < 0) boostTimer = 0;
            }

            let moveDir = 0;
            if (keys['ArrowLeft'] || keys['a'] || keys['A']) moveDir = -1;
            if (keys['ArrowRight'] || keys['d'] || keys['D']) moveDir = 1;

            let speed = player.speed;
            if (boostTimer > 0) speed *= 1.5;

            player.x += moveDir * speed * dt;
            player.x = Math.max(35, Math.min(W - 35, player.x));

            itemSpawnTimer -= dt;
            if (itemSpawnTimer <= 0) {
                spawnItem();
                itemSpawnTimer = Math.max(0.2, 0.8 - (180 - timeLeft) * 0.003);
            }

            for (let i = items.length - 1; i >= 0; i--) {
                let item = items[i];
                item.wobble += item.wobbleSpeed * dt;
                item.x = item.baseX + Math.sin(item.wobble) * 12;
                item.y += item.speed * dt;

                if (checkCollision(player.x, player.y, player.width, player.height, item.x, item.y, 20)) {
                    if (item.type === 'milk_tea') {
                        score += 10;
                        addFloatingText(item.x, item.y - 20, '+10', '#FFD700');
                    } else if (item.type === 'claypot_rice') {
                        lives--;
                        addFloatingText(item.x, item.y - 20, '-1 生命!', '#FF6B6B');
                        if (lives <= 0) {
                            gameOverReason = '生命耗盡！';
                            state = 'gameover';
                            return;
                        }
                    } else if (item.type === 'pineapple_bun') {
                        score += 5;
                        boostTimer = 3.0;
                        addFloatingText(item.x, item.y - 20, '+5 加速!', '#FFA500');
                    }
                    items.splice(i, 1);
                    continue;
                }

                if (item.y > H + 50) {
                    items.splice(i, 1);
                }
            }

            for (let i = floatingTexts.length - 1; i >= 0; i--) {
                let ft = floatingTexts[i];
                ft.y -= 50 * dt;
                ft.life -= dt;
                if (ft.life <= 0) {
                    floatingTexts.splice(i, 1);
                }
            }

            fallSpeedBase = 200 + (180 - Math.max(0, timeLeft)) * 0.3;
        }

        function drawBackground() {
            let grad = ctx.createLinearGradient(0, 0, 0, H - 60);
            grad.addColorStop(0, '#FDE8C4');
            grad.addColorStop(0.6, '#F2D0A8');
            grad.addColorStop(1, '#DFB088');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, W, H - 60);

            ctx.strokeStyle = 'rgba(255,255,255,0.2)';
            ctx.lineWidth = 1;
            for (let x = 0; x < W; x += 50) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, H - 60);
                ctx.stroke();
            }
            for (let y = 0; y < H - 60; y += 50) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(W, y);
                ctx.stroke();
            }

            ctx.fillStyle = 'rgba(0,0,0,0.03)';
            for (let x = 25; x < W; x += 50) {
                for (let y = 25; y < H - 60; y += 50) {
                    ctx.beginPath();
                    ctx.arc(x, y, 2, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            let grad2 = ctx.createLinearGradient(0, H - 60, 0, H);
            grad2.addColorStop(0, '#C4A882');
            grad2.addColorStop(1, '#7A5C40');
            ctx.fillStyle = grad2;
            ctx.fillRect(0, H - 60, W, 60);

            ctx.strokeStyle = 'rgba(0,0,0,0.15)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(0, H - 60);
            ctx.lineTo(W, H - 60);
            ctx.stroke();

            ctx.lineWidth = 1;
            for (let x = 0; x < W; x += 40) {
                ctx.beginPath();
                ctx.moveTo(x, H - 60);
                ctx.lineTo(x, H);
                ctx.stroke();
            }

            let grad3 = ctx.createLinearGradient(0, H - 60, W, H - 60);
            grad3.addColorStop(0, 'rgba(255,255,255,0.06)');
            grad3.addColorStop(0.5, 'rgba(255,255,255,0.12)');
            grad3.addColorStop(1, 'rgba(255,255,255,0.06)');
            ctx.fillStyle = grad3;
            ctx.fillRect(0, H - 60, W, 60);
        }

        function drawMilkTea(ctx, x, y) {
            ctx.save();
            ctx.translate(x, y);
            ctx.shadowColor = 'rgba(0,0,0,0.2)';
            ctx.shadowBlur = 6;
            ctx.shadowOffsetY = 3;

            ctx.fillStyle = '#FFF0E6';
            roundRect(ctx, -14, -15, 28, 35, 6);
            ctx.fill();

            ctx.fillStyle = '#C8965E';
            roundRect(ctx, -11, -4, 22, 18, 4);
            ctx.fill();

            ctx.fillStyle = '#5D3A2A';
            ctx.beginPath();
            ctx.arc(-3, 6, 3, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(5, 9, 3, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#D4A574';
            roundRect(ctx, -15, -18, 30, 6, 3);
            ctx.fill();

            ctx.fillStyle = '#FF6B9D';
            ctx.fillRect(-2, -32, 5, 20);
            ctx.fillStyle = '#FF8FB3';
            ctx.fillRect(-2, -32, 2, 20);

            ctx.shadowBlur = 0;
            ctx.shadowOffsetY = 0;
            ctx.restore();
        }

        function drawClaypotRice(ctx, x, y) {
            ctx.save();
            ctx.translate(x, y);
            ctx.shadowColor = 'rgba(0,0,0,0.25)';
            ctx.shadowBlur = 6;
            ctx.shadowOffsetY = 3;

            ctx.fillStyle = '#6B3A24';
            ctx.beginPath();
            ctx.ellipse(0, 0, 24, 18, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#8B5A2B';
            ctx.beginPath();
            ctx.ellipse(0, -2, 20, 14, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#FFF3D4';
            ctx.beginPath();
            ctx.ellipse(0, -4, 16, 10, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#E8D5A8';
            for (let i = -1; i <= 1; i++) {
                for (let j = -1; j <= 1; j++) {
                    ctx.beginPath();
                    ctx.arc(i * 6 + (j % 2) * 3, -4 + j * 4, 2, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            ctx.strokeStyle = 'rgba(200,200,200,0.6)';
            ctx.lineWidth = 2;
            ctx.shadowBlur = 0;
            for (let i = 0; i < 3; i++) {
                ctx.beginPath();
                ctx.moveTo(-8 + i * 8, -22);
                ctx.quadraticCurveTo(-8 + i * 8 + 4, -30, -8 + i * 8, -40);
                ctx.stroke();
            }

            ctx.restore();
        }

        function drawPineappleBun(ctx, x, y) {
            ctx.save();
            ctx.translate(x, y);
            ctx.shadowColor = 'rgba(0,0,0,0.2)';
            ctx.shadowBlur = 6;
            ctx.shadowOffsetY = 3;

            ctx.fillStyle = '#DAA520';
            ctx.beginPath();
            ctx.ellipse(0, 2, 18, 13, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#E8A735';
            ctx.beginPath();
            ctx.ellipse(0, -2, 17, 12, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.strokeStyle = '#B8860B';
            ctx.lineWidth = 1.2;
            for (let i = -1; i <= 1; i++) {
                ctx.beginPath();
                ctx.moveTo(-15, -2 + i * 5);
                ctx.lineTo(15, -2 + i * 5);
                ctx.stroke();
            }
            for (let i = -1; i <= 1; i++) {
                ctx.beginPath();
                ctx.moveTo(i * 6, -12);
                ctx.lineTo(i * 6, 8);
                ctx.stroke();
            }

            ctx.fillStyle = '#FFE44D';
            roundRect(ctx, -6, 2, 12, 8, 2);
            ctx.fill();

            ctx.shadowBlur = 0;
            ctx.shadowOffsetY = 0;
            ctx.restore();
        }

        function drawItems() {
            for (let item of items) {
                if (item.type === 'milk_tea') {
                    drawMilkTea(ctx, item.x, item.y);
                } else if (item.type === 'claypot_rice') {
                    drawClaypotRice(ctx, item.x, item.y);
                } else if (item.type === 'pineapple_bun') {
                    drawPineappleBun(ctx, item.x, item.y);
                }
            }
        }

        function drawPlayer(ctx) {
            let x = player.x;
            let y = player.y;
            let isBoosted = boostTimer > 0;

            ctx.save();

            ctx.fillStyle = 'rgba(0,0,0,0.15)';
            ctx.beginPath();
            ctx.ellipse(x, y + 30, 32, 7, 0, 0, Math.PI * 2);
            ctx.fill();

            if (isBoosted) {
                ctx.strokeStyle = 'rgba(255, 215, 0, ' + (0.5 + Math.sin(boostTimer * 6) * 0.3) + ')';
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.ellipse(x, y + 30, 45, 12, 0, 0, Math.PI * 2);
                ctx.stroke();
                ctx.fillStyle = 'rgba(255, 215, 0, 0.12)';
                ctx.beginPath();
                ctx.ellipse(x, y + 30, 45, 12, 0, 0, Math.PI * 2);
                ctx.fill();
            }

            ctx.shadowColor = 'rgba(0,0,0,0.25)';
            ctx.shadowBlur = 10;
            ctx.shadowOffsetY = 4;

            ctx.fillStyle = '#2C3E50';
            roundRect(ctx, x - 17, y + 12, 14, 14, 4);
            ctx.fill();
            roundRect(ctx, x + 3, y + 12, 14, 14, 4);
            ctx.fill();

            ctx.fillStyle = '#1A1A1A';
            roundRect(ctx, x - 19, y + 24, 20, 6, 3);
            ctx.fill();
            roundRect(ctx, x - 1, y + 24, 20, 6, 3);
            ctx.fill();

            ctx.fillStyle = '#E74C3C';
            roundRect(ctx, x - 22, y - 18, 44, 36, 10);
            ctx.fill();

            ctx.fillStyle = '#FFF';
            ctx.beginPath();
            ctx.moveTo(x - 8, y - 18);
            ctx.lineTo(x, y - 5);
            ctx.lineTo(x + 8, y - 18);
            ctx.closePath();
            ctx.fill();

            ctx.fillStyle = '#87CEEB';
            roundRect(ctx, x - 17, y - 2, 34, 20, 5);
            ctx.fill();

            ctx.shadowBlur = 0;
            ctx.fillStyle = '#A0522D';
            roundRect(ctx, x - 28, y - 2, 56, 7, 3);
            ctx.fill();
            ctx.fillStyle = '#D2B48C';
            roundRect(ctx, x - 24, y - 1, 48, 3, 2);
            ctx.fill();

            ctx.shadowColor = 'rgba(0,0,0,0.25)';
            ctx.shadowBlur = 8;
            ctx.fillStyle = '#FFDAB9';
            ctx.beginPath();
            ctx.arc(x, y - 30, 14, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#3D2B1F';
            ctx.beginPath();
            ctx.arc(x, y - 33, 14, Math.PI, 2 * Math.PI);
            ctx.fill();

            ctx.fillStyle = '#2C2C2C';
            roundRect(ctx, x - 18, y - 49, 36, 10, 5);
            ctx.fill();
            ctx.fillStyle = '#E74C3C';
            roundRect(ctx, x - 14, y - 45, 28, 3, 2);
            ctx.fill();
            roundRect(ctx, x - 22, y - 43, 44, 5, 2);
            ctx.fill();

            ctx.fillStyle = '#333';
            ctx.beginPath();
            ctx.arc(x - 5, y - 30, 3, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(x + 5, y - 30, 3, 0, Math.PI * 2);
            ctx.fill();

            ctx.strokeStyle = '#C0392B';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.arc(x, y - 21, 4, 0.1 * Math.PI, 0.9 * Math.PI);
            ctx.stroke();

            ctx.restore();
        }

        function drawHUD() {
            ctx.save();
            let hudY = 15;
            let boxH = 40;

            ctx.fillStyle = 'rgba(0,0,0,0.6)';
            roundRect(ctx, 10, hudY, 150, boxH, 12);
            ctx.fill();
            ctx.strokeStyle = 'rgba(255,255,255,0.15)';
            ctx.lineWidth = 1;
            roundRect(ctx, 10, hudY, 150, boxH, 12);
            ctx.stroke();

            ctx.fillStyle = '#FFD700';
            ctx.font = 'bold 20px "Microsoft JhengHei", sans-serif';
            ctx.textAlign = 'left';
            ctx.textBaseline = 'middle';
            ctx.fillText('分數: ' + score, 25, hudY + boxH / 2 + 1);

            ctx.fillStyle = 'rgba(0,0,0,0.6)';
            roundRect(ctx, 170, hudY, 130, boxH, 12);
            ctx.fill();
            ctx.strokeStyle = 'rgba(255,255,255,0.15)';
            roundRect(ctx, 170, hudY, 130, boxH, 12);
            ctx.stroke();

            ctx.fillStyle = '#FF6B6B';
            ctx.fillText('生命: ' + lives, 185, hudY + boxH / 2 + 1);

            ctx.fillStyle = 'rgba(0,0,0,0.6)';
            roundRect(ctx, 310, hudY, 130, boxH, 12);
            ctx.fill();
            ctx.strokeStyle = 'rgba(255,255,255,0.15)';
            roundRect(ctx, 310, hudY, 130, boxH, 12);
            ctx.stroke();

            let timeColor = timeLeft < 30 ? '#FF6B6B' : '#4ECDC4';
            ctx.fillStyle = timeColor;
            ctx.fillText('時間: ' + Math.ceil(timeLeft), 325, hudY + boxH / 2 + 1);

            if (boostTimer > 0) {
                ctx.fillStyle = 'rgba(255, 215, 0, 0.9)';
                roundRect(ctx, W - 130, 15, 120, 34, 10);
                ctx.fill();
                ctx.fillStyle = '#8B6914';
                ctx.font = 'bold 18px "Microsoft JhengHei", sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('加速中!', W - 70, 32);
            }

            ctx.restore();
        }

        function drawButton(text, cx, cy, w, h, color) {
            ctx.save();
            ctx.shadowColor = 'rgba(0,0,0,0.35)';
            ctx.shadowBlur = 12;
            ctx.shadowOffsetY = 5;
            ctx.fillStyle = color;
            roundRect(ctx, cx - w / 2, cy - h / 2, w, h, 16);
            ctx.fill();

            ctx.shadowBlur = 0;
            ctx.shadowOffsetY = 0;
            ctx.fillStyle = 'rgba(255,255,255,0.2)';
            roundRect(ctx, cx - w / 2, cy - h / 2 + 2, w, h / 2, 14);
            ctx.fill();

            ctx.fillStyle = '#FFF';
            ctx.font = 'bold 26px "Microsoft JhengHei", sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(text, cx, cy + 2);
            ctx.restore();
        }

        function drawStartScreen() {
            drawBackground();

            let titleY = 150 + Math.sin(performance.now() / 900) * 5;

            ctx.fillStyle = 'rgba(0,0,0,0.3)';
            ctx.font = 'bold 54px "Microsoft JhengHei", sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('茶餐廳奶茶速遞員', W / 2 + 4, titleY + 4);

            ctx.fillStyle = '#5D3A1A';
            ctx.fillText('茶餐廳奶茶速遞員', W / 2, titleY);

            ctx.fillStyle = '#DAA520';
            roundRect(ctx, W / 2 - 200, titleY + 40, 400, 4, 2);
            ctx.fill();

            drawMilkTea(ctx, W / 2, 265);

            ctx.fillStyle = 'rgba(0,0,0,0.7)';
            ctx.font = '20px "Microsoft JhengHei", sans-serif';
            ctx.fillText('用 ← → 或 A D 控制速遞員移動', W / 2, 345);
            ctx.fillText('接奶茶 +10分', W / 2, 378);
            ctx.fillText('避開煲仔飯！接菠蘿油 +5分 + 加速', W / 2, 411);

            drawButton('開始遊戲', W / 2, 475, 220, 60, '#E74C3C');
        }

        function drawGameOverScreen() {
            ctx.fillStyle = 'rgba(0,0,0,0.7)';
            ctx.fillRect(0, 0, W, H);

            ctx.fillStyle = '#FF6B6B';
            ctx.font = 'bold 50px "Microsoft JhengHei", sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.shadowColor = 'rgba(0,0,0,0.5)';
            ctx.shadowBlur = 10;
            ctx.fillText(gameOverReason || '遊戲結束', W / 2, 140);
            ctx.shadowBlur = 0;

            ctx.fillStyle = '#FFD700';
            ctx.font = 'bold 38px "Microsoft JhengHei", sans-serif';
            ctx.fillText('最終分數: ' + score, W / 2, 220);

            drawMilkTea(ctx, W / 2, 300);

            drawButton('再玩一次', W / 2, 430, 220, 60, '#E74C3C');
        }

        function drawFloatingTexts() {
            for (let ft of floatingTexts) {
                let alpha = ft.life / ft.maxLife;
                ctx.globalAlpha = alpha;
                ctx.fillStyle = ft.color;
                ctx.font = 'bold 24px "Microsoft JhengHei", sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(ft.text, ft.x, ft.y);
            }
            ctx.globalAlpha = 1;
        }

        function gameLoop(t) {
            let dt = (t - lastTime) / 1000;
            lastTime = t;
            if (dt > 0.1) dt = 0.1;

            ctx.clearRect(0, 0, W, H);

            if (state === 'start') {
                drawStartScreen();
            } else if (state === 'playing') {
                update(dt);
                drawBackground();
                drawItems();
                drawPlayer(ctx);
                drawFloatingTexts();
                drawHUD();
            } else if (state === 'gameover') {
                drawBackground();
                drawItems();
                drawPlayer(ctx);
                drawGameOverScreen();
                drawFloatingTexts();
            }

            requestAnimationFrame(gameLoop);
        }

        document.addEventListener('keydown', e => {
            keys[e.key] = true;
            if (state === 'start' && (e.key === ' ' || e.key === 'Enter')) {
                resetGame();
            }
            if (state === 'gameover' && (e.key === ' ' || e.key === 'Enter')) {
                resetGame();
            }
            if (e.key.startsWith('Arrow')) {
                e.preventDefault();
            }
        });

        document.addEventListener('keyup', e => {
            keys[e.key] = false;
        });

        function getMousePos(e) {
            let rect = canvas.getBoundingClientRect();
            let scaleX = W / rect.width;
            let scaleY = H / rect.height;
            return {
                x: (e.clientX - rect.left) * scaleX,
                y: (e.clientY - rect.top) * scaleY
            };
        }

        canvas.addEventListener('click', e => {
            let pos = getMousePos(e);
            let mx = pos.x;
            let my = pos.y;

            if (state === 'start') {
                if (mx > W / 2 - 110 && mx < W / 2 + 110 && my > 445 && my < 505) {
                    resetGame();
                }
            } else if (state === 'gameover') {
                if (mx > W / 2 - 110 && mx < W / 2 + 110 && my > 400 && my < 460) {
                    resetGame();
                }
            }
        });

        canvas.addEventListener('mousemove', e => {
            if (state !== 'playing') return;
            let pos = getMousePos(e);
            player.x = Math.max(35, Math.min(W - 35, pos.x));
        });

        canvas.addEventListener('touchstart', e => {
            e.preventDefault();
            let rect = canvas.getBoundingClientRect();
            let scaleX = W / rect.width;
            let scaleY = H / rect.height;
            let mx = (e.touches[0].clientX - rect.left) * scaleX;
            let my = (e.touches[0].clientY - rect.top) * scaleY;

            if (state === 'start') {
                if (mx > W / 2 - 110 && mx < W / 2 + 110 && my > 445 && my < 505) {
                    resetGame();
                }
            } else if (state === 'gameover') {
                if (mx > W / 2 - 110 && mx < W / 2 + 110 && my > 400 && my < 460) {
                    resetGame();
                }
            }
        }, { passive: false });

        canvas.addEventListener('touchmove', e => {
            e.preventDefault();
            if (state !== 'playing') return;
            let rect = canvas.getBoundingClientRect();
            let scaleX = W / rect.width;
            let mx = (e.touches[0].clientX - rect.left) * scaleX;
            player.x = Math.max(35, Math.min(W - 35, mx));
        }, { passive: false });

        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
